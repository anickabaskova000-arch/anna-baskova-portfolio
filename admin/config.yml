backend:
  name: github
  repo: anickabaskova000-arch/anna-baskova-portfolio
  branch: main
  base_url: https://anna-baskova-portfolio.vercel.app
  auth_endpoint: /api/auth
  commit_messages:
    update: 'Web: úprava {{collection}}'
    uploadMedia: 'Web: nahrán soubor {{path}}'
    deleteMedia: 'Web: smazán soubor {{path}}'

locale: cs
publish_mode: simple
media_folder: assets/photos
public_folder: /assets/photos

collections:
  - name: hero
    label: 'Hero – úvod'
    icon: text_fields
    files:
      - name: hero
        label: 'Hero – úvod'
        file: content/texts.json
        fields:
          - { name: hero_badge, label: 'Štítek v hlavičce (hero)', widget: string }
          - { name: hero_tagline_cs, label: 'Kdo jsem (CZ)', widget: string }
          - { name: hero_tagline_en, label: 'Kdo jsem (EN)', widget: string, required: false }
          - name: hero_formats
            label: 'Zaměření (štítky pod „Kdo jsem")'
            widget: list
            max: 10
            min: 1
            summary: '{{fields.label_cs}}'
            fields:
              - { name: label_cs, label: 'Zaměření (CZ)', widget: string, hint: 'např. Beauty, Wellness, Fashion, Food, Sport, Travel, Events' }
              - { name: label_en, label: 'Zaměření (EN)', widget: string, required: false }
          - { name: hero_cta_cs, label: 'Hero – tlačítko (CZ)', widget: string }
          - { name: hero_cta_en, label: 'Hero – tlačítko (EN)', widget: string, required: false }
          - { name: contact_email, label: 'Kontaktní e-mail', widget: string }
          - { name: contact_instagram_handle, label: 'Instagram handle (bez @)', widget: string }

  - name: showcase
    label: 'Top showcase (videa)'
    icon: movie
    files:
      - name: showcase
        label: 'Top showcase'
        file: content/showcase.json
        description: 'Vertikální videa pod hero. Prvních 5 je vidět rovnou, zbytek se odkryje tlačítkem „Zobrazit více". Žádné fotky.'
        fields:
          - name: items
            label: 'Videa'
            label_singular: 'Video'
            widget: list
            max: 40
            min: 1
            summary: '{{fields.brand}} — {{fields.format_cs}}'
            fields:
              - { name: file, label: 'Video soubor', widget: file, media_folder: assets/videos, public_folder: /assets/videos, hint: 'Velké soubory (desítky MB) radši pošli vývojáři ke zkomprimování.' }
              - { name: brand, label: 'Značka (štítek dole)', widget: string, hint: 'např. Reserved, Sebamed, heroine × Matějovský, nebo Vlastní produkce' }
              - { name: format_cs, label: 'Štítek formátu (CZ)', widget: string, hint: 'např. Problem/Solution, Aesthetic Skincare, Dynamic Sport' }
              - { name: format_en, label: 'Štítek formátu (EN)', widget: string, required: false }

  - name: brands
    label: 'Značky & reference'
    icon: verified
    files:
      - name: brands
        label: 'Loga značek'
        file: content/brands.json
        fields:
          - name: items
            label: 'Loga'
            label_singular: 'Logo'
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: 'Název značky', widget: string }
              - { name: file, label: 'Logo (obrázek)', widget: image }
